name: owner-review-v6-one-shot

on:
  push:
    branches:
      - feature/industrial-workshop-production-cells-v1

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'arm Owner Review V6')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply corrective patch
        run: node scripts/apply-owner-review-v6.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Owner Review V6 domain acceptance
        run: npm run smoke:owner-review-v6
      - name: Remove one-shot delivery helpers
        run: rm scripts/apply-owner-review-v6.mjs .github/workflows/owner-review-v6-apply.yml
      - name: Commit corrected source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply Owner Review V6 corrective pass"
          git push origin HEAD:${GITHUB_REF_NAME}
