name: dev-plant-ready-workforce-v3-apply
on:
  push:
    branches:
      - feature/p0-p1-business-stage-base-shell-v1
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p0-p1-business-stage-base-shell-v1
          fetch-depth: 1
      - name: Apply canonical Plant-ready Workforce V3 preset
        run: node scripts/apply-dev-plant-ready-workforce-v3.mjs
      - name: Commit patch when needed
        run: |
          if git diff --quiet -- src/manual_review_dev_v2.ts; then
            echo "Plant-ready preset already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Shwedsky@users.noreply.github.com"
          git add src/manual_review_dev_v2.ts
          git commit -m "fix: make Plant-ready preset use canonical Workforce V3"
          git push origin HEAD:feature/p0-p1-business-stage-base-shell-v1
