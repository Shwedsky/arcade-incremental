name: temp-pack-e-acceptance

on:
  push:
    branches: [content/pack-e-z8-processing-plant-v1]
    paths:
      - .github/workflows/tmp-pack-e-acceptance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/pack-e-z8-processing-plant-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Pack E acceptance compatibility patch
        run: |
          python scripts/tmp_pack_e_acceptance_patch.py
          python scripts/tmp_pack_e_acceptance_fix.py
      - name: Verify Pack E acceptance
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run smoke:packe
          npm run smoke:contract-board-v2
          npx playwright install --with-deps chromium
          npm run smoke:browser:packe
      - name: Commit acceptance gates and remove temporary patch files
        run: |
          rm scripts/tmp_pack_e_acceptance_patch.py scripts/tmp_pack_e_acceptance_fix.py .github/workflows/tmp-pack-e-acceptance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: add Pack E Chromium and Save V10 acceptance gates"
          git push origin HEAD:content/pack-e-z8-processing-plant-v1
