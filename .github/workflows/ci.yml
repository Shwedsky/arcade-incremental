name: playable-slice-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Deterministic gameplay smoke
        run: npm run smoke
      - name: Early-game systems smoke
        run: npm run smoke:early
      - name: Workshop scheduler domain smoke
        run: npm run smoke:workshop-scheduler
      - name: Workshop scheduler V7 migration smoke
        run: npm run smoke:workshop-migration
      - name: Queued resource reservation smoke
        run: npm run smoke:reservations
      - name: Worker Economy V2 legacy domain smoke
        run: npm run smoke:worker-economy-v2
      - name: Workforce / Fleet V3 domain smoke
        run: npm run smoke:workforce-fleet-v3
      - name: Fleet Network V1 multi-route domain smoke
        run: npm run smoke:fleet-network-v1
      - name: Production Cells V1 parallel domain smoke
        run: npm run smoke:production-cells-v1
      - name: Visual Baseline V1 structural contract
        run: npm run smoke:visual-baseline-v1
      - name: Field Visual Baseline V1 structural contract
        run: npm run smoke:field-visual-baseline-v1
      - name: Stage Visual Consistency V1 structural contract
        run: npm run smoke:stage-visual-consistency-v1
      - name: Visual Rebuild V2 art contract
        run: npm run smoke:visual-rebuild-v2
      - name: Contract Board V2 legacy domain smoke
        run: npm run smoke:contract-board-v2
      - name: Contract Board V3 standing + special domain smoke
        run: npm run smoke:contract-board-v3
      - name: Talent V4 / extended progression domain smoke
        run: npm run smoke:progression-v2
      - name: Business Stage V1 domain smoke
        run: npm run smoke:business-stage
      - name: Industrial Chain V1 migration + sink proof
        run: npm run smoke:industrial-chain-v1
      - name: Midgame domain smoke
        run: npm run smoke:midgame
      - name: Visual foundation smoke
        run: npm run smoke:visual
      - name: Content Pack A smoke
        run: npm run smoke:content
      - name: Content Pack B smoke
        run: npm run smoke:packb
      - name: Content Pack C domain smoke
        run: npm run smoke:packc
      - name: Content Pack D domain smoke
        run: npm run smoke:packd
      - name: Content Pack E domain smoke
        run: npm run smoke:packe
      - name: Save safety smoke
        run: npm run smoke:save
      - name: Platform adapter smoke
        run: npm run smoke:platform
      - name: Legacy progression pacing proof
        run: python models/progression_sim_v0.py --check
      - name: Talent V4 progression model proof
        run: python models/progression_expansion_v2.py --check
      - name: Economy / Progression V4-compatible proof
        run: python models/economy_progression_model_v3.py --check
      - name: Mid/Late mechanics structural proof
        run: python models/mid_late_mechanics_sim_v1.py --check
      - name: Worker / progression economy V2 model proof
        run: python models/worker_progression_economy_v2.py --check
      - name: Content Pack E structural proof
        run: python models/content_pack_e_v1.py
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Headless browser progression smoke
        run: npm run smoke:browser
      - name: Headless browser midgame regression
        run: npm run smoke:browser:midgame
      - name: Headless browser Content Pack B proof
        run: npm run smoke:browser:packb
      - name: Headless browser Content Pack C proof
        run: npm run smoke:browser:packc
      - name: Headless browser Content Pack D proof
        run: npm run smoke:browser:packd
      - name: Headless browser Content Pack E proof
        run: npm run smoke:browser:packe
      - name: Workshop Queue desktop/mobile browser proof
        run: npm run smoke:browser:workshop-queue
      - name: Manual review launch + feedback UX compatibility proof
        run: npm run smoke:browser:manual-review
      - name: Manual Review DEV durable preset proof
        run: npm run smoke:browser:manual-review-dev-v2
      - name: Base Shell stage-aware browser proof
        run: npm run smoke:browser:base-shell-v1
      - name: Hangar Transformation V1 browser acceptance
        run: npm run smoke:browser:hangar-transformation-v1
      - name: Salvage Yard / Fleet Network V1 browser acceptance
        run: npm run smoke:browser:salvage-yard-fleet-network-v1
      - name: Industrial Workshop / Production Cells V1 browser acceptance
        run: npm run smoke:browser:production-cells-v1
      - name: Human Feedback V2 compatibility proof
        run: npm run smoke:browser:human-feedback-v2
      - name: Human Feedback V3 compatibility proof
        run: npm run smoke:browser:human-feedback-v3
      - name: Worker Economy V2 compatibility proof
        run: npm run smoke:browser:worker-economy-v2
      - name: Contract Board V2 compatibility proof
        run: npm run smoke:browser:contract-board-v2
      - name: Progression browser compatibility proof
        run: npm run smoke:browser:progression-v2
      - name: Core Rebuild V1 end-to-end browser proof
        run: npm run smoke:browser:core-rebuild-v1
      - name: Owner Feedback V5 browser acceptance
        id: owner_v5
        continue-on-error: true
        shell: bash
        run: npm run smoke:browser:owner-feedback-v5 > owner-feedback-v5.log 2>&1
      - name: Upload Owner Feedback V5 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-feedback-v5-diagnostics
          path: owner-feedback-v5.log
          if-no-files-found: error
      - name: Stop on Owner Feedback V5 failure
        if: steps.owner_v5.outcome != 'success'
        shell: bash
        run: |
          cat owner-feedback-v5.log
          exit 1
      - name: Owner Review V6 domain acceptance
        run: npm run smoke:owner-review-v6
      - name: Owner Review V6 browser acceptance
        run: npm run smoke:browser:owner-review-v6
      - name: Platform and responsive browser proof
        run: npm run smoke:browser:platform
      - name: Capture Visual Rebuild V2 review screenshots
        run: npm run capture:visual-rebuild-v2
      - uses: actions/upload-artifact@v4
        with:
          name: visual-rebuild-v2-review-screenshots
          path: visual-review-v2/*.png
          if-no-files-found: error
      - name: Build release manifest
        run: npm run release:manifest
      - name: Package internal release candidate
        run: zip -r arcade-incremental-release-candidate-v10.zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: arcade-incremental-release-candidate-v10
          path: arcade-incremental-release-candidate-v10.zip
          if-no-files-found: error
