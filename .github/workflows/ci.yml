name: playable-slice-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Deterministic gameplay smoke
        run: npm run smoke
      - name: Package web slice
        run: zip -r arcade-incremental-playable-v0.zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: arcade-incremental-playable-v0
          path: arcade-incremental-playable-v0.zip
          if-no-files-found: error
