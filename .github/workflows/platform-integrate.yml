name: platform-foundation-integration

on:
  push:
    branches: [platform/release-foundation-v1]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platform/release-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Wire platform runtime
        run: python scripts/apply_platform_foundation.py
      - name: Typecheck and build
        run: npm run build
      - name: Existing domain smokes
        run: npm run smoke && npm run smoke:early && npm run smoke:midgame && npm run smoke:visual && npm run smoke:content
      - name: Save and platform smokes
        run: npm run smoke:save && npm run smoke:platform
      - name: Structural proofs
        run: python models/progression_sim_v0.py --check && python models/mid_late_mechanics_sim_v1.py --check
      - name: Commit runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git diff --cached --check
          git commit -m "platform: integrate save safety and SDK lifecycle"
          git push origin HEAD:platform/release-foundation-v1
