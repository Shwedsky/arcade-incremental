name: V3-B.1 integrate owner visual-readability feedback

on:
  push:
    branches:
      - feature/progression-reframe-v3-b-active-field-loop
    paths:
      - 'scripts/apply-v3-b1-visual-readability.mjs'
      - '.github/workflows/v3-b1-visual-readability-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply V3-B.1 owner-feedback patch
        run: node scripts/apply-v3-b1-visual-readability.mjs
      - name: Verify intended semantics exist
        shell: bash
        run: |
          grep -q "Куча бытового лома" src/zone_content.ts
          grep -q "drawReadablePile" src/field_view.ts
          grep -q "drawPlaceIdentity" src/field_view.ts
          grep -q "5 НАПРАВЛЕНИЙ РАЗВИТИЯ" src/v3_a_clarity.css
          grep -q "V3-B.1 VISUAL READABILITY" review/README_V3B.txt
          test -f docs/V3_B1_VISUAL_READABILITY_FOLLOWUP.md
      - name: Typecheck and production build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: V3-B deterministic domain smoke
        run: npx tsx scripts/v3-b-active-field-smoke.ts
      - name: Persist corrective pass
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Visual-readability patch already integrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/field_view.ts src/zone_content.ts src/v3_a_clarity.css review/README_V3B.txt docs/V3_B1_VISUAL_READABILITY_FOLLOWUP.md
          git commit -m "feat(v3-b): close owner visual-readability feedback"
          git push origin HEAD:feature/progression-reframe-v3-b-active-field-loop
