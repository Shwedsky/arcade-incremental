name: v3-a-clarity-gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  v3-a-clarity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: V3-A Clarity Foundation browser acceptance
        run: npx tsx scripts/browser-v3-a-clarity-smoke.ts
      - name: V3 formal DEV review presets survive reload
        run: npx tsx scripts/browser-v3-review-presets-smoke.ts
      - name: Capture V3-A formal review surfaces
        run: npx tsx scripts/browser-v3-a-capture.ts
      - uses: actions/upload-artifact@v4
        with:
          name: v3-a-clarity-review-screenshots
          path: visual-review-v3-a/*.png
          if-no-files-found: error
