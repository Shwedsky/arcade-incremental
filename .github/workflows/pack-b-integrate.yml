name: pack-b-one-shot-integration

on:
  push:
    branches: [content/pack-b-z4-hangar-truck-v1]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/pack-b-z4-hangar-truck-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Repair Pack B patcher
        run: python scripts/fix_pack_b_patcher.py
      - name: Apply Pack B integration if needed
        run: |
          if grep -q "import './content_pack_b.css';" src/main.ts; then
            echo "Pack B runtime already integrated"
          else
            python scripts/apply_pack_b_integration.py
          fi
      - name: Typecheck and build
        run: npm run build
      - name: Existing gameplay regressions
        run: npm run smoke && npm run smoke:early && npm run smoke:midgame && npm run smoke:visual && npm run smoke:content
      - name: Content Pack B domain smoke
        run: npx tsx scripts/content-pack-b-smoke.ts
      - name: Mid/Late structural proof
        run: python models/mid_late_mechanics_sim_v1.py --check
      - name: Commit integrated runtime only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git commit -m "pack-b: integrate Z4 Hangar Truck and Wide Swing runtime"
          git push origin HEAD:content/pack-b-z4-hangar-truck-v1
