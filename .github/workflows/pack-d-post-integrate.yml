name: pack-d-post-integration

on:
  push:
    branches: [content/pack-d-z7-rig-workshop-v1]
    paths:
      - 'scripts/repair_pack_d_live_runtime.py'
      - '.github/workflows/pack-d-post-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply live Pack D repair
        run: python scripts/repair_pack_d_live_runtime.py
      - name: Typecheck and build
        run: npm run build
      - name: Domain regressions
        run: |
          npm run smoke
          npm run smoke:early
          npm run smoke:midgame
          npm run smoke:visual
          npm run smoke:content
          npm run smoke:packb
          npm run smoke:packc
          npm run smoke:packd
          npm run smoke:save
          npm run smoke:platform
      - name: Structural model regression
        run: |
          python models/progression_sim_v0.py --check
          python models/mid_late_mechanics_sim_v1.py --check
      - name: Commit repaired live runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts
          git diff --cached --quiet && { echo 'No repair diff produced'; exit 1; }
          git commit -m 'fix: complete Pack D live runtime integration'
          git push
