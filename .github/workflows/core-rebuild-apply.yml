name: core-rebuild-runtime-apply

on:
  push:
    branches:
      - feature/p0-p1-business-stage-base-shell-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p0-p1-business-stage-base-shell-v1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded core integration
        run: |
          node scripts/apply-core-runtime-v3.mjs
          node scripts/apply-core-runtime-v3-stage2.mjs
          node scripts/apply-core-runtime-v3-stage3.mjs
          node scripts/apply-core-dev-v4.mjs
          node scripts/apply-industrial-ui-v1.mjs
      - name: Commit generated patches when needed
        run: |
          if git diff --quiet -- src/main.ts src/manual_review_dev_v2.ts; then
            echo "Core integration already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Shwedsky@users.noreply.github.com"
          git add src/main.ts src/manual_review_dev_v2.ts
          git commit -m "refactor: align industrial ui with simplified chain"
          git push origin HEAD:feature/p0-p1-business-stage-base-shell-v1
