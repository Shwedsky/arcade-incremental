name: core-rebuild-runtime-apply

on:
  push:
    branches:
      - feature/p0-p1-business-stage-base-shell-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p0-p1-business-stage-base-shell-v1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded main runtime integration
        run: |
          node scripts/apply-core-runtime-v3.mjs
          node scripts/apply-core-runtime-v3-stage2.mjs
      - name: Commit generated runtime patch when needed
        run: |
          if git diff --quiet -- src/main.ts; then
            echo "Runtime integration already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git commit -m "feat: integrate core runtime v3 stage2"
          git push origin HEAD:feature/p0-p1-business-stage-base-shell-v1
