name: temp-pack-e-infra

on:
  push:
    branches: [content/pack-e-z8-processing-plant-v1]
    paths:
      - .github/workflows/tmp-pack-e-infra.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/pack-e-z8-processing-plant-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Pack E infrastructure patch
        run: |
          python scripts/tmp_pack_e_infra_patch.py
          python scripts/tmp_pack_e_infra_fix.py
      - name: Verify typecheck and Pack E smoke
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run smoke:packe
          python models/content_pack_e_v1.py
      - name: Commit runtime infrastructure and remove temporary patch files
        run: |
          rm scripts/tmp_pack_e_infra_patch.py scripts/tmp_pack_e_infra_fix.py .github/workflows/tmp-pack-e-infra.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Pack E Z8 and Save V10 infrastructure"
          git push origin HEAD:content/pack-e-z8-processing-plant-v1
