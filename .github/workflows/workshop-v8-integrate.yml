name: workshop-v8-one-shot-integration

on:
  push:
    branches: [ux/workshop-queue-v1]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/workshop-queue-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure Save V8 runtime and browser expectations
        run: |
          if ! grep -q 'interface SaveStateV8' src/main.ts; then
            python scripts/apply_workshop_v8_runtime.py
            python - <<'PY'
          from pathlib import Path
          p=Path('src/main.ts')
          s=p.read_text(encoding='utf-8')
          old='targetLevel:a.targetLevel,equipmentId:'
          new="targetLevel:('targetLevel' in a?a.targetLevel:undefined),equipmentId:"
          if s.count(old)!=1:
              raise SystemExit(f'compatibility targetLevel anchor count: {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          fi
          python scripts/update_save_v8_browser_expectations.py
      - name: Guarded typecheck and deterministic proofs
        run: |
          npm run build
          npm run smoke:early
          npm run smoke:workshop-scheduler
          npm run smoke:workshop-migration
          npm run smoke:midgame
          npm run smoke:packb
          npm run smoke:packc
          npm run smoke:packd
      - name: Commit integration updates
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts scripts/browser-*-smoke.ts
          git commit -m "test: migrate browser regressions to Save V8"
          git push origin HEAD:ux/workshop-queue-v1
