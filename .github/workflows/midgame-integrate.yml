name: midgame-one-shot-integration

on:
  push:
    branches: [feature/midgame-proof-v1]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/midgame-proof-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply midgame integration
        run: python scripts/apply_midgame_integration.py
      - name: Typecheck and build
        run: npm run build
      - name: Existing gameplay smoke
        run: npm run smoke && npm run smoke:early
      - name: Midgame domain smoke
        run: npm run smoke:midgame
      - name: Structural pacing proof
        run: python models/mid_late_mechanics_sim_v1.py --check
      - name: Commit integrated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts package.json .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "midgame: integrate zones van and worker runtime"
          git push origin HEAD:feature/midgame-proof-v1
