name: content-pack-a-integration

on:
  push:
    branches: [content/pack-a-z1-z3-v1]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/pack-a-z1-z3-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Wire Pack A runtime
        run: python scripts/apply_content_pack_a.py
      - name: Typecheck and build
        run: npm run build
      - name: Domain and content smokes
        run: npm run smoke && npm run smoke:early && npm run smoke:midgame && npm run smoke:visual && npm run smoke:content
      - name: Structural proofs
        run: python models/progression_sim_v0.py --check && python models/mid_late_mechanics_sim_v1.py --check
      - name: Commit runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/field_view.ts
          git diff --cached --check
          git commit -m "content: wire zone variants and garage growth runtime"
          git push origin HEAD:content/pack-a-z1-z3-v1
