name: p5-heavy-support-apply-once

on:
  push:
    branches:
      - feature/industrial-workshop-production-cells-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[p5-heavy-support-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/industrial-workshop-production-cells-v1
          fetch-depth: 0
      - run: node scripts/apply-p5-heavy-support-v1.mjs
      - name: Commit runtime patch
        run: |
          if git diff --quiet -- src/main.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git commit -m "feat: connect Recovery Rig to heavy assembly [p5-heavy-support-applied]"
          git push origin HEAD:feature/industrial-workshop-production-cells-v1
