name: plant-generic-staffing-apply
on:
  push:
    branches:
      - feature/p0-p1-business-stage-base-shell-v1
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p0-p1-business-stage-base-shell-v1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Plant generic staffing migration
        run: node scripts/apply-plant-generic-staffing-v1.mjs
      - name: Commit generated main patch when needed
        run: |
          if git diff --quiet -- src/main.ts; then
            echo "Plant staffing integration already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Shwedsky@users.noreply.github.com"
          git add src/main.ts
          git commit -m "refactor: gate Processing Plant by generic team readiness"
          git push origin HEAD:feature/p0-p1-business-stage-base-shell-v1
