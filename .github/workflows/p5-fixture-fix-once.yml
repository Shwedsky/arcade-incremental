name: p5-fixture-fix-once

on:
  push:
    branches:
      - feature/industrial-workshop-production-cells-v1
    paths:
      - scripts/apply-p5-browser-fixture-fix.mjs
      - .github/workflows/p5-fixture-fix-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/industrial-workshop-production-cells-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic fixture patch
        run: node scripts/apply-p5-browser-fixture-fix.mjs
      - name: Commit fixture fix
        run: |
          if git diff --quiet -- scripts/browser-production-cells-v1-smoke.ts; then
            echo "No fixture change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/browser-production-cells-v1-smoke.ts
          git commit -m "test: preserve P5 Save V10 across browser reload"
          git push origin HEAD:feature/industrial-workshop-production-cells-v1
