name: p5-runtime-apply-once

on:
  push:
    branches:
      - feature/industrial-workshop-production-cells-v1

permissions:
  contents: write

jobs:
  apply-runtime:
    if: ${{ !contains(github.event.head_commit.message, '[p5-runtime-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/industrial-workshop-production-cells-v1
          fetch-depth: 0
      - name: Apply deterministic runtime patch
        run: node scripts/apply-production-cells-runtime-v1.mjs
      - name: Commit patched runtime
        run: |
          if git diff --quiet -- src/main.ts; then
            echo "No runtime changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git commit -m "feat: integrate Production Cells V1 runtime [p5-runtime-applied]"
          git push origin HEAD:feature/industrial-workshop-production-cells-v1
