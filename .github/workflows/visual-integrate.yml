name: visual-foundation-integration

on:
  push:
    branches: [art/visual-production-foundation-v1]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/visual-production-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Wire visual runtime
        run: python scripts/apply_visual_runtime.py
      - name: Typecheck and build
        run: npm run build
      - name: Existing domain smokes
        run: npm run smoke && npm run smoke:early && npm run smoke:midgame
      - name: Visual foundation smoke
        run: npm run smoke:visual
      - name: Structural proofs
        run: python models/progression_sim_v0.py --check && python models/mid_late_mechanics_sim_v1.py --check
      - name: Commit runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          git diff --cached --check
          git commit -m "visual: wire zone van and worker presentation"
          git push origin HEAD:art/visual-production-foundation-v1
