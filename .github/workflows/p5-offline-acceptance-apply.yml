name: p5-offline-acceptance-apply-once

on:
  push:
    branches:
      - feature/industrial-workshop-production-cells-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[p5-offline-acceptance-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/industrial-workshop-production-cells-v1
          fetch-depth: 0
      - run: node scripts/apply-p5-offline-acceptance.mjs
      - name: Commit acceptance/runtime patch
        run: |
          if git diff --quiet -- src/main.ts src/production_cells_v1.ts scripts/browser-production-cells-v1-smoke.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/production_cells_v1.ts scripts/browser-production-cells-v1-smoke.ts
          git commit -m "test: harden P5 startup offline acceptance [p5-offline-acceptance-applied]"
          git push origin HEAD:feature/industrial-workshop-production-cells-v1
