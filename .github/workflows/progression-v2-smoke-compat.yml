name: progression-v2-smoke-compat

on:
  push:
    branches: [feature/progression-expansion-v2]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/progression-expansion-v2
          fetch-depth: 0
      - run: node scripts/apply-progression-v2-smoke-compat.mjs
      - run: |
          rm scripts/apply-progression-v2-smoke-compat.mjs
          rm .github/workflows/progression-v2-smoke-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/smoke.ts scripts/apply-progression-v2-smoke-compat.mjs .github/workflows/progression-v2-smoke-compat.yml
          git commit -m "test: align deterministic smoke with Progression V2 gates"
          git push origin HEAD:feature/progression-expansion-v2
